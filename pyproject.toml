[project]
name = "ableton-mcp"
version = "0.1.0"
description = "MCP server that drives Ableton Live 12 through a stdlib-only Remote Script."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3,<3"]

[project.scripts]
ableton-mcp = "ableton_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "remote_script"]
